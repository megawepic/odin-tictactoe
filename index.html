<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic-tac-toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="header">
        <h1>Welcome to Tic Tac Toe</h1>
    </div>

    <div id="start-screen" class="screen">
        <h1>Enter Player Names</h1>

        <form id="start-form">
            <input type="text" id="player1" placeholder="Player 1 Name (X)" required />
            <input type="text" id="player2" placeholder="Player 2 Name (O)" required />
            <button type="submit" class="start-game">Start Game</button>
        </form>
    </div>


    <div id="game-screen" class="game screen">
        <div id="score"></div>

        <div class="grid-container">
            <div class="tile" id="button-one" data-index="0"></div>
            <div class="tile" id="button-two" data-index="1"></div>
            <div class="tile" id="button-three" data-index="2"></div>
            <div class="tile" id="button-four" data-index="3"></div>
            <div class="tile" id="button-five" data-index="4"></div>
            <div class="tile" id="button-six" data-index="5"></div>
            <div class="tile" id="button-seven" data-index="6"></div>
            <div class="tile" id="button-eight" data-index="7"></div>
            <div class="tile" id="button-nine" data-index="8"></div>
        </div>

        <div id="end-round">
            <div id="game-options"></div>
        </div>
    </div>
    <script src="code.js"></script>
</body>
</html>
